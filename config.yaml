# =============================================================================
# Intel Xeon AMX Genomics Booth Demo — single source of truth for all tunables
# =============================================================================
# Every value the demo depends on lives here. Nothing is hardcoded in the app.
#
# HONESTY POLICY (enforced in code, not just documented):
#   * Timings, variant counts, and the reported instruction set are always read
#     from real runs. Never fabricated.
#   * Any number that is an assumption or estimate is marked `illustrative: true`
#     and the UI labels it as such on screen.
#   * Dataset `sha256` values start empty. fetch_data.sh computes them on first
#     verified download and writes data/CHECKSUMS.sha256. Copy them in here once,
#     after which they are authoritative and mismatches fail loudly.
# =============================================================================

demo:
  title: "Genomics on Built-In Xeon Acceleration"
  subtitle: "DeepVariant germline variant calling · Intel AMX + AVX-512"
  partner_mark: "Intel + Kontron co-engineered"
  # Bind on all interfaces so the booth monitor / a tablet can reach it.
  host: "0.0.0.0"
  port: 7860
  # Show the browser full screen; the CSS targets a 3-metre viewing distance.
  theme_accent: "#0068B5"        # Intel blue
  theme_accent_bright: "#00C7FD" # Intel light blue

# -----------------------------------------------------------------------------
# Storage layout
# -----------------------------------------------------------------------------
# On this booth box the 3.5 TB U.2 NVMe is mounted at /mnt/nvme2n1 (verified
# ext4, 3.3 TB free). If that mount is missing these paths fall back to the
# repo-local ./data directory and preflight warns loudly about free space --
# the OS drive has only ~28 GB free, far too little for the 46 GB WGS sample.
paths:
  data_root: "/mnt/nvme2n1/genomics"
  data_root_fallback: "./data"
  runs_dir: "runs"        # relative to data_root; per-run output directories
  traces_dir: "./traces"  # recorded runs for DEMO MODE

# -----------------------------------------------------------------------------
# Container engines
# -----------------------------------------------------------------------------
# All of these are TensorFlow/oneDNN based, so all of them honour the
# ONEDNN_MAX_CPU_ISA ceiling that powers the AMX toggle.
engines:
  # DEFAULT. Pullable straight from Docker Hub, no local build, works offline
  # once pulled. This is the BAM-in path used for live booth runs.
  google_deepvariant:
    label: "DeepVariant (upstream, CPU/oneDNN)"
    image: "google/deepvariant:1.10.0"
    buildable: false
    path: "bam_in"
    default: true

  # Intel Open-Omics optimised DeepVariant. Must be BUILT locally from the
  # IntelLabs Dockerfile — there is no prebuilt image on Docker Hub.
  #
  # A "~2.7x faster call_variants" claim used to sit in this comment. It came
  # from the project brief, not from a measurement, and it is NOT supported by
  # anything we have run. Measured on this box, stock DeepVariant 1.5.0 with
  # the same bf16/AMX rewrite Open-Omics applies: call_variants 284.2 s -> 
  # 240.1 s on HG002 chr20. That is 1.18x, not 2.7x.
  #
  # Open-Omics also parallelises postprocess_variants and raises the batch
  # size, so the full fork may beat 1.18x — but until it is built and timed
  # here, no multiplier belongs in this file. See docs/AMX-FINDINGS.md.
  open_omics_bams2vcf:
    label: "Open-Omics DeepVariant (Intel optimised, BAM-in)"
    image: "open-omics/bams2vcf:r1.5"
    buildable: true
    build_repo: "https://github.com/IntelLabs/Open-Omics-Acceleration-Framework"
    build_context: "pipelines/deepvariant-based-germline-variant-calling-fq2vcf"
    build_dockerfile: "Dockerfile_bams2vcf"
    path: "bam_in"
    default: false

  # Full FASTQ-in pipeline: bwa-mem2 -> sort -> DeepVariant. Optional, long
  # running, needs a bwa-mem2 index. Best for the headline WGS story, not for
  # a two-minute booth run.
  open_omics_fq2bams:
    label: "Open-Omics fq2bams (bwa-mem2 alignment)"
    image: "open-omics/fq2bams:r1.5"
    buildable: true
    build_repo: "https://github.com/IntelLabs/Open-Omics-Acceleration-Framework"
    build_context: "pipelines/deepvariant-based-germline-variant-calling-fq2vcf"
    build_dockerfile: "Dockerfile_fq2bams"
    path: "fq2vcf"
    default: false

# -----------------------------------------------------------------------------
# THE AMX TOGGLE — the money shot
# -----------------------------------------------------------------------------
# The ONLY thing that changes between an AMX-ON and an AMX-OFF run is the
# oneDNN instruction-set ceiling below. Same BAM, same reference, same shard
# count, same NUMA policy, same image. That is what makes the delta honest and
# attributable purely to AMX.
# NOTE: the keys are `enabled`/`disabled` rather than `on`/`off` because YAML 1.1
# parses bare on/off as booleans, which silently breaks the lookup.
amx:
  # WHAT THIS TOGGLE CAN AND CANNOT SHOW -- read docs/AMX-FINDINGS.md.
  #
  # Measured on this box (Xeon 6740P, HG002 chr20, DeepVariant 1.10.0):
  #
  #   AMX OFF (fp32, AVX-512)     call_variants  0.041 s / 100 examples
  #   AMX ON  (fp32, ISA ceiling) call_variants  0.042 s / 100 examples
  #   AMX ON  (bf16, real AMX)    call_variants  0.064-0.066 s / 100 examples
  #
  # Two facts follow, both verified rather than assumed:
  #
  #  1. Raising the ISA ceiling alone changes NOTHING. DeepVariant's shipped
  #     model is fp32; AMX has no fp32 path; every convolution dispatches to
  #     brgconv:avx512_core and the tiles stay idle. End-to-end: 0.98x.
  #
  #  2. Forcing bf16 (which does put work on the AMX tiles -- confirmed as
  #     brgconv:avx512_core_amx) is ~1.6x SLOWER here AND breaks correctness:
  #     the genotype likelihoods stop summing to one and DeepVariant's own
  #     round_gls() raises ValueError, killing a post-processing worker.
  #
  # So the AMX race is kept as an EVIDENCE panel, not a headline. It reports
  # what really happened, including "AMX permitted but never used". The booth
  # headline is the core-scaling race below, which is a real Xeon story that
  # needs no precision trade.
  enabled:
    label: "AMX ON"
    onednn_max_cpu_isa: "AVX512_CORE_AMX"
    description: "AMX permitted (fp32 model -- tiles have no work to do)"
    env:
      ONEDNN_DEFAULT_FP32_MATH_MODE: "F32"
  disabled:
    label: "AMX OFF"
    onednn_max_cpu_isa: "AVX512_CORE"
    description: "AVX-512 baseline, AMX tiles disabled"
    env:
      ONEDNN_DEFAULT_FP32_MATH_MODE: "F32"
  # oneDNN prints the ISA it actually selected when verbose mode is on. We parse
  # that back out of the logs and display it, so the toggle is verifiable rather
  # than merely asserted.
  verify_isa_from_logs: true
  onednn_verbose: 1
  # Fail the run rather than quietly reporting a fake result if oneDNN ignored
  # the requested ceiling (e.g. unsupported value on this oneDNN build).
  fail_on_isa_mismatch: true
  # Mount app/container_inject/sitecustomize.py to force TensorFlow to bf16.
  # OFF by default because on stock DeepVariant 1.10 it is both slower and
  # incorrect (see above). Set true only to reproduce that finding yourself --
  # the run will hang after call_variants when the post-processing worker dies.
  use_bf16_injection: false

# ---------------------------------------------------------------------------
# Core-scaling race -- the honest booth headline.
#
# Both legs run the identical binary, data, shard count and ISA settings. The
# ONLY difference is how many logical CPUs Docker lets the container touch
# (--cpuset-cpus). That makes the comparison trivially valid, needs no
# precision trade, and shows the thing that is actually true about this
# machine: variant calling scales across Xeon cores.
scaling:
  # Baseline core budget. Kept as a cpuset string so it is exactly what gets
  # passed to Docker -- no arithmetic between what is configured and what runs.
  #
  # Measured on this box (HG002 chr20, 192 shards, both legs called exactly
  # 210,390 variants -- identical output, so nothing was traded for the speed):
  #
  #    16 cores   342.7-346.6 s -> 2.78-2.86x  (two independent races)
  #    48 cores   161.7 s    ->  1.35x
  #    96 cores   129.5 s    ->  1.06x
  #   192 threads 119.6 s    ->  1.00x  (reference)
  #
  # Scaling is sublinear past ~96 because make_examples is I/O- and
  # Python-bound, and the last 96 are SMT siblings rather than cores. 16 is
  # chosen as the baseline because it gives the largest honest ratio; the
  # slower leg takes about six minutes, so pace booth visitors accordingly.
  baseline_cpuset: "0-15"
  baseline_label: "16 cores"
  full_label: "all 192 threads"

# -----------------------------------------------------------------------------
# Compute / placement
# -----------------------------------------------------------------------------
# Held IDENTICAL across AMX ON and OFF. The runner reads one shared parameter
# set for both legs of a race so the comparison cannot drift.
compute:
  # null => auto-detect with nproc. Override for a quieter, more repeatable run.
  num_shards: null
  # NUMA policy applied via numactl. This box exposes 4 NUMA nodes (SNC2 mode:
  # two sub-NUMA clusters per socket), verified with lscpu.
  #   interleave_all  -> numactl --interleave=all   (recommended, simplest)
  #   none            -> no numactl wrapper
  #   bind_node       -> numactl --cpunodebind=N --membind=N (set numa_node)
  numa_policy: "interleave_all"
  numa_node: 0
  # Docker resource caps. null => uncapped.
  docker_shm_size: "16g"
  docker_memory: null
  # File-descriptor limit inside the container. Docker's default soft limit is
  # 1024, which 192 shards blow through instantly ("OSError: [Errno 24] Too
  # many open files") because make_examples holds every shard's output open at
  # once. Applied identically to both legs, so it cannot skew a comparison.
  docker_ulimit_nofile: "65536:524288"
  # How to invoke the container engine. Normally just ["docker"]. Override for
  # podman, a non-PATH binary, or when a freshly granted `docker` group does
  # not yet apply to the running login session (["sg", "docker", "-c"] needs a
  # shell, so prefer logging out and back in). Both legs of a race always use
  # the same value, so this cannot skew a comparison.
  container_cli: ["docker"]

# -----------------------------------------------------------------------------
# Datasets — every URL below was verified reachable; sizes are the real
# Content-Length in bytes reported by the origin server.
# -----------------------------------------------------------------------------
# sha256 is intentionally EMPTY. Populate from data/CHECKSUMS.sha256 after the
# first verified download. `md5_b64` is the authoritative MD5 published by
# Google Cloud Storage in the x-goog-hash response header, captured at
# verification time — not invented.
datasets:

  reference:
    name: "GRCh38 no-ALT analysis set (GIAB recommended)"
    url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/references/GRCh38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz"
    local: "reference/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz"
    size_bytes: 886344618
    sha256: "3c8def6d325c5d1e934b2dd530c4d1709f027677a15859467071fddf3fff2026"
    tier: "core"
    # GIAB publishes the bgzip index files alongside the reference, so we fetch
    # them rather than spending booth time regenerating them.
    sidecars:
      - url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/references/GRCh38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz.fai"
        local: "reference/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz.fai"
      - url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/references/GRCh38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz.gzi"
        local: "reference/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz.gzi"

  # Derived locally by slicing the verified GRCh38 chr20 BAM above.
  #
  # It is NOT the DeepVariant quickstart NA12878 BAM. That file is aligned to
  # hg19 (chr1 LN:249250621, chrM LN:16571), so pairing it with the GRCh38
  # reference gives "0 bases found in common among our input files" and the
  # smoke test fails. Slicing our own GRCh38 BAM keeps the whole demo on one
  # reference build and one sample lineage.
  #
  # Being derived, it has no upstream checksum: its integrity comes from the
  # sha256-pinned parent plus the recorded region below.
  smoke_bam:
    name: "HG002 chr20:10.0-10.1Mb, GRCh38 (pre-flight smoke test)"
    local: "smoke/HG002.grch38.chr20.10_10p1mb.bam"
    derived_from: "chr20_bam"
    derive_region: "chr20:10000000-10100000"
    sha256: ""
    tier: "core"

  chr20_bam:
    name: "HG002 NovaSeq PCR-free 35x — chr20 only"
    url: "https://storage.googleapis.com/deepvariant/case-study-testdata/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.chr20.bam"
    local: "chr20/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.chr20.bam"
    size_bytes: 1093938924
    md5_b64: "jxpUGjSIA+MEJ1NZrFLaVw=="
    sha256: "34ac157739e1feeb590f6eb7e11046ccc2aa3277fd55a3ce0942e774d931ed81"
    tier: "core"
    sidecars:
      - url: "https://storage.googleapis.com/deepvariant/case-study-testdata/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.chr20.bam.bai"
        local: "chr20/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.chr20.bam.bai"
        md5_b64: "TUiS9OE62rkHRYd7PgHFtg=="

  wgs_bam:
    name: "HG002 NovaSeq PCR-free 35x — full WGS"
    url: "https://storage.googleapis.com/deepvariant/case-study-testdata/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.bam"
    local: "wgs/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.bam"
    size_bytes: 46033519192
    md5_b64: "yel1og/WdArz2xgnHXX+Kw=="
    sha256: ""
    tier: "wgs"    # only fetched with --with-wgs
    sidecars:
      - url: "https://storage.googleapis.com/deepvariant/case-study-testdata/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.bam.bai"
        local: "wgs/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.bam.bai"
        md5_b64: "Vi+MiiCzdIZm53b4G9dVhg=="

  # Truth set for the accuracy panel. NOTE: the GIAB `latest/GRCh38/` path used
  # in much older documentation now 404s — `latest` was repointed and no longer
  # contains a GRCh38 subdirectory. We pin the explicit NISTv4.2.1 release,
  # which is both reachable and reproducible.
  truth_vcf:
    name: "HG002 GIAB truth set v4.2.1 (GRCh38)"
    url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    local: "truth/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    size_bytes: 156252944
    sha256: ""
    tier: "truth"
    sidecars:
      - url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz.tbi"
        local: "truth/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz.tbi"

  truth_bed:
    name: "HG002 GIAB high-confidence regions v4.2.1"
    url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    local: "truth/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    size_bytes: 11494021
    sha256: ""
    tier: "truth"

# GIAB rotates FASTQ filenames, so the exact names are a config value rather
# than being baked into the fetch script. Only used by the optional fq2vcf path.
fastq:
  enabled: false
  base_url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/HG002_HiSeq300x_fastq/140528_D00360_0018_AH8VC6ADXX/Project_RM8391_RM8392/Sample_2A1/"
  r1: "2A1_CGATGT_L001_R1_001.fastq.gz"
  r2: "2A1_CGATGT_L001_R2_001.fastq.gz"
  local_dir: "fastq"

# -----------------------------------------------------------------------------
# Booth-facing sample menu (DATASET PICKER screen)
# -----------------------------------------------------------------------------
# runtime_estimate_* are shown to booth staff for PACING ONLY and are labelled
# "estimate" in the UI until a real run replaces them. After the first live run
# the app displays the measured time instead.
samples:
  - id: "smoke"
    label: "Smoke test — HG002 chr20 100 kb (GRCh38)"
    dataset: "smoke_bam"
    regions: "chr20:10,000,000-10,100,000"
    blurb: "Pre-flight only. Confirms the whole stack is alive in under a minute."
    # Measured on this box: 64.6 s, 313 variants, all 192 threads.
    runtime_fast_s: 65
    runtime_slow_s: 90
    illustrative: true
    show_in_booth: false

  - id: "chr20"
    label: "HG002 chr20 — 35x WGS subset"
    dataset: "chr20_bam"
    regions: "chr20"
    blurb: "The live booth run. Whole chromosome 20 at 35x depth."
    # MEASURED on this box, not estimated. Core-scaling race, 192 shards,
    # 210,390 variants called identically by both legs:
    #   16 cores  342.7-346.6 s    48 cores  161.7 s
    #   96 cores  129.5 s          192 thr   119.6-123.2 s
    runtime_fast_s: 123
    runtime_slow_s: 345
    illustrative: false
    show_in_booth: true

  - id: "wgs"
    label: "HG002 full genome — 35x WGS"
    dataset: "wgs_bam"
    regions: null
    blurb: "The headline run. Complete 30-35x human genome, 46 GB of aligned reads."
    # runtime_fast_s is MEASURED on this box: 25m 47s (1547 s) on all 192
    # threads, 192 shards, DeepVariant 1.10.0, 7,709,239 variants.
    #   make_examples 13m50s | call_variants 11m05s | postprocess 49s
    # For reference, Google publish 69 min for 1.10 on a 96-vCPU n2-standard-96.
    #
    # Note this beat the estimate scaled from chr20 (~46 min) by a wide margin:
    # a whole genome offers far more independent work than a single contig, so
    # chr20 UNDERSTATES whole-genome scaling. Do not extrapolate the other way.
    #
    # runtime_slow_s (16-core leg) is still an estimate -- that run was launched
    # but the box rebooted before it finished. Since `illustrative` governs both
    # numbers, it stays true until the baseline is measured too.
    runtime_fast_s: 1547
    runtime_slow_s: 9000
    illustrative: true
    show_in_booth: true

# -----------------------------------------------------------------------------
# DEMO MODE — never show a blank screen
# -----------------------------------------------------------------------------
demo_mode:
  # auto  -> replay only when a live run is impossible (no Docker / no data)
  # never -> always attempt a real run and surface the failure
  # always-> force replay (useful for a dry rehearsal)
  policy: "auto"
  trace_file: "traces/chr20-booth.json"
  # The UI shows a permanent, unmistakable banner while replaying. Non-negotiable.
  banner_text: "REPLAY MODE — recorded run, not live hardware"

# -----------------------------------------------------------------------------
# Acoustics
# -----------------------------------------------------------------------------
acoustics:
  # If a USB dB meter or mic is present, point at it and the Home screen shows a
  # live reading. Otherwise the configured static value is shown, explicitly
  # labelled as a specification figure rather than a live measurement.
  live_meter_enabled: false
  live_meter_device: null
  static_dba: 35
  spec_max_dba: 65
  note: "Air-cooled, bench-deployable. Target <65 dB(A); ~35 dB(A) observed."

# -----------------------------------------------------------------------------
# EFFICIENCY / TCO PANEL — every figure here is an ASSUMPTION
# -----------------------------------------------------------------------------
# The UI renders this whole panel behind an "Illustrative — based on configured
# assumptions" label. These are planning inputs, not measurements.
tco:
  illustrative: true
  disclaimer: >-
    Figures on this panel are calculated from the configured assumptions below.
    They are illustrative planning estimates, not measured results. Runtime
    inputs are taken from real runs where one has completed in this session.
  assumptions:
    server_power_watts_idle: 400
    server_power_watts_load: 1100
    electricity_cost_per_kwh: 0.16
    currency: "USD"
    hours_per_day_available: 20      # allowing for maintenance windows
    default_weekly_sample_volume: 50
    # Mbases callable per genome, used for throughput maths.
    mbases_per_wgs_genome: 3100
    mbases_per_chr20: 64
